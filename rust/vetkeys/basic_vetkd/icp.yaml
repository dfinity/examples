canisters:
  - name: backend
    recipe:
      type: "@dfinity/rust@v3.4.0"
      configuration:
        package: backend
        candid: backend/backend.did

  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.4.0"
      configuration:
        dir: frontend/dist
        build:
          - npm install --prefix frontend
          - npm run build --prefix frontend

networks:
  - name: local
    mode: managed
    ii: true
