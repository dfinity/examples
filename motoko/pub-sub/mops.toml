[toolchain]
moc = "1.14.1"

[dependencies]
core = "2.6.1"

[moc]
args = [ "--default-persistent-actors", "-W=M0236,M0237,M0223" ]

[canisters.publisher]
main = "publisher/main.mo"
candid = "publisher/publisher.did"

[canisters.subscriber]
main = "subscriber/main.mo"
args = [ "--default-persistent-actors", "-W=M0236,M0237,M0223", "--actor-env-alias", "publisher", "PUBLIC_CANISTER_ID:publisher", "publisher/publisher.did" ]
