# Motoko dependencies (https://mops.one/)

[toolchain]
moc = "1.11.0"

[dependencies]
core = "2.5.0"

[moc]
# M0236: use context dot notation (e.g. x.toText() instead of Nat.toText(x))
# M0237: redundant explicit implicit arguments (e.g. Nat.compare is inferred automatically)
# M0223: redundant type instantiation (e.g. Array.tabulate instead of Array.tabulate<T>)
args = ["--default-persistent-actors", "-W=M0236,M0237,M0223"]

[canisters.backend]
main = "backend/main.mo"
candid = "backend/backend.did"
# --actor-env-alias <alias> <envvar> <did-path>: resolve the `canister:llm`
# import from the PUBLIC_CANISTER_ID:llm env var (injected by icp deploy), typed
# against the LLM canister's committed Candid interface — so no LLM actor type
# is declared in the backend.
# Per-canister args replace the global [moc].args, so repeat those flags here.
args = [
    "--default-persistent-actors",
    "-W=M0236,M0237,M0223",
    "--actor-env-alias", "llm", "PUBLIC_CANISTER_ID:llm", "candid/llm.did",
]
